<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923"/>
      <stop offset="100%" style="stop-color:#1a2a3a"/>
    </linearGradient>
    <radialGradient id="discGrad" cx="38%" cy="32%" r="70%">
      <stop offset="0%"   style="stop-color:#535353"/>
      <stop offset="55%"  style="stop-color:#2b2b2b"/>
      <stop offset="100%" style="stop-color:#161616"/>
    </radialGradient>
    <linearGradient id="hndL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#d2d2d2"/>
      <stop offset="30%"  style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#c0c0c0"/>
    </linearGradient>
    <linearGradient id="hndR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   style="stop-color:#d2d2d2"/>
      <stop offset="30%"  style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#c0c0c0"/>
    </linearGradient>
    <radialGradient id="stickGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%"   style="stop-color:#484848"/>
      <stop offset="100%" style="stop-color:#0e0e0e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ctrlShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- ══════════════ BACKGROUND ══════════════ -->
  <rect width="900" height="530" fill="url(#bgGrad)" rx="16"/>
  <rect x="1" y="1" width="898" height="528" fill="none" stroke="#2a4a6a" stroke-width="1.5" rx="16"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#e0f0ff" letter-spacing="1">Meta Quest 3S — Mapping des Manettes</text>
  <text x="450" y="53" text-anchor="middle" font-size="11" fill="#6a9abf">Tiny Flight Simulator VR</text>
  <line x1="60" y1="63" x2="840" y2="63" stroke="#2a4a6a" stroke-width="1"/>

  <!-- ══════════════ LEFT CONTROLLER ══════════════ -->
  <text x="195" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#7ac" letter-spacing="0.5">MANETTE GAUCHE</text>

  <g filter="url(#ctrlShadow)">
    <!-- Handle body (white plastic) -->
    <path d="M169,245 Q162,283 164,320 Q168,340 197,343 Q226,340 230,320 Q232,283 225,245 Z"
          fill="url(#hndL)" stroke="#9a9a9a" stroke-width="1.3"/>
    <!-- Trigger guard — inner right side (index finger, left hand) -->
    <path d="M225,249 Q244,259 242,280 Q240,296 225,300"
          fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.3"/>
    <!-- Disc — large circular head (on top of handle) -->
    <circle cx="197" cy="175" r="73" fill="url(#discGrad)" stroke="#4a4a4a" stroke-width="1.8"/>
    <!-- Subtle inner rim for depth -->
    <circle cx="197" cy="175" r="66" fill="none" stroke="#363636" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- Left thumbstick — upper-left of disc -->
  <circle cx="167" cy="155" r="22" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="167" cy="155" r="14" fill="url(#stickGrad)" stroke="#4a8aba" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="163" cy="151" r="1.6" fill="#2e2e2e"/>
  <circle cx="167" cy="148" r="1.6" fill="#2e2e2e"/>
  <circle cx="171" cy="151" r="1.6" fill="#2e2e2e"/>

  <!-- Y button — upper-right of left disc -->
  <circle cx="228" cy="150" r="13" fill="#222" stroke="#5abaff" stroke-width="1.8"/>
  <text x="228" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#8ad4ff">Y</text>

  <!-- X button — center-right of left disc -->
  <circle cx="233" cy="181" r="13" fill="#222" stroke="#5abaff" stroke-width="1.8"/>
  <text x="233" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#8ad4ff">X</text>

  <!-- Menu button (≡) — center-left of left disc -->
  <circle cx="163" cy="194" r="10" fill="#2d2d2d" stroke="#555" stroke-width="1.2"/>
  <text x="163" y="198" text-anchor="middle" font-size="10" fill="#999">≡</text>

  <!-- ── LEFT labels ── -->
  <!-- Thumbstick → left side -->
  <line x1="148" y1="143" x2="68" y2="112" stroke="#4a8aba" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="4" y="91" width="64" height="40" rx="4" fill="#0a1a2a" stroke="#2a5a7a" stroke-width="1"/>
  <text x="36" y="105" text-anchor="middle" font-size="9" font-weight="700" fill="#7ac">←→ ROULIS</text>
  <text x="36" y="117" text-anchor="middle" font-size="9" fill="#5a8aaa">↑↓ TANGAGE</text>
  <text x="36" y="127" text-anchor="middle" font-size="8" fill="#3a6a8a" font-style="italic">(↓ = cabrer)</text>

  <!-- Y → toward center -->
  <line x1="241" y1="144" x2="298" y2="112" stroke="#2a5a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="298" y="100" width="84" height="17" rx="3" fill="#0a1520" stroke="#1e3a5a" stroke-width="1"/>
  <text x="340" y="112" text-anchor="middle" font-size="9" fill="#3a6a8a">Libre (extension)</text>

  <!-- X → toward center -->
  <line x1="246" y1="181" x2="305" y2="181" stroke="#2a5a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="305" y="172" width="84" height="17" rx="3" fill="#0a1520" stroke="#1e3a5a" stroke-width="1"/>
  <text x="347" y="184" text-anchor="middle" font-size="9" fill="#3a6a8a">Libre (extension)</text>

  <!-- Menu → left side -->
  <line x1="153" y1="201" x2="68" y2="228" stroke="#3a6a7a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="4" y="220" width="64" height="17" rx="3" fill="#0a1520" stroke="#1e3a5a" stroke-width="1"/>
  <text x="36" y="232" text-anchor="middle" font-size="9" fill="#4a7a8a">Menu système</text>

  <!-- Trigger guard → toward center -->
  <line x1="243" y1="274" x2="305" y2="264" stroke="#4a7a6a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="305" y="254" width="88" height="17" rx="3" fill="#0a1a10" stroke="#1e4a3a" stroke-width="1"/>
  <text x="349" y="266" text-anchor="middle" font-size="9" fill="#4a8a6a">Gâchette gauche (libre)</text>

  <!-- ══════════════ CENTER DIVIDER ══════════════ -->
  <line x1="450" y1="68" x2="450" y2="428" stroke="#2a4a6a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ══════════════ RIGHT CONTROLLER ══════════════ -->
  <text x="700" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#adc" letter-spacing="0.5">MANETTE DROITE</text>

  <g filter="url(#ctrlShadow)">
    <!-- Handle body (white plastic) -->
    <path d="M665,245 Q658,283 660,320 Q664,340 693,343 Q722,340 726,320 Q728,283 721,245 Z"
          fill="url(#hndR)" stroke="#9a9a9a" stroke-width="1.3"/>
    <!-- Trigger guard — inner left side (index finger, right hand) -->
    <path d="M665,249 Q646,259 648,280 Q650,296 665,300"
          fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.3"/>
    <!-- Disc — large circular head (on top of handle) -->
    <circle cx="693" cy="175" r="73" fill="url(#discGrad)" stroke="#4a4a4a" stroke-width="1.8"/>
    <!-- Subtle inner rim for depth -->
    <circle cx="693" cy="175" r="66" fill="none" stroke="#363636" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- Right thumbstick — upper-right of disc -->
  <circle cx="723" cy="155" r="22" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="723" cy="155" r="14" fill="url(#stickGrad)" stroke="#4aaa6a" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="719" cy="151" r="1.6" fill="#2e2e2e"/>
  <circle cx="723" cy="148" r="1.6" fill="#2e2e2e"/>
  <circle cx="727" cy="151" r="1.6" fill="#2e2e2e"/>

  <!-- B button — upper-left of right disc -->
  <circle cx="662" cy="150" r="13" fill="#2a1212" stroke="#ff6a6a" stroke-width="1.8"/>
  <text x="662" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff9a9a">B</text>

  <!-- A button — center-left of right disc -->
  <circle cx="657" cy="181" r="13" fill="#122a12" stroke="#4aff6a" stroke-width="1.8"/>
  <text x="657" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#6aff8a">A</text>

  <!-- Meta button (∞) — center-right of right disc -->
  <circle cx="727" cy="194" r="10" fill="#2d2d2d" stroke="#555" stroke-width="1.2"/>
  <text x="727" y="199" text-anchor="middle" font-size="11" fill="#999">∞</text>

  <!-- ── RIGHT labels ── -->
  <!-- Thumbstick → right side -->
  <line x1="742" y1="143" x2="824" y2="112" stroke="#4aaa6a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="824" y="91" width="68" height="40" rx="4" fill="#0a1a0a" stroke="#2a5a3a" stroke-width="1"/>
  <text x="858" y="105" text-anchor="middle" font-size="9" font-weight="700" fill="#adc">←→ LACET</text>
  <text x="858" y="117" text-anchor="middle" font-size="9" fill="#7aaa8a">↑↓ GAZ</text>
  <text x="858" y="127" text-anchor="middle" font-size="8" fill="#4a8a5a" font-style="italic">(↑ augmente)</text>

  <!-- B → toward center -->
  <line x1="649" y1="144" x2="510" y2="112" stroke="#aa4a4a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="426" y="100" width="84" height="17" rx="3" fill="#1a0a0a" stroke="#4a2a2a" stroke-width="1"/>
  <text x="468" y="112" text-anchor="middle" font-size="9" font-weight="700" fill="#ff9a9a">CHANGER VUE</text>

  <!-- A → toward center -->
  <line x1="644" y1="181" x2="592" y2="181" stroke="#3aaa4a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="508" y="172" width="84" height="17" rx="3" fill="#0a1a0a" stroke="#2a5a2a" stroke-width="1"/>
  <text x="550" y="184" text-anchor="middle" font-size="9" font-weight="700" fill="#4aff6a">MOTEUR ON/OFF</text>

  <!-- Trigger guard right → toward center -->
  <line x1="648" y1="274" x2="592" y2="264" stroke="#3a9a6a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="508" y="254" width="84" height="17" rx="3" fill="#0a1a0a" stroke="#2a5a3a" stroke-width="1"/>
  <text x="550" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#4aff9a">FREINS (maintien)</text>

  <!-- Meta → right side -->
  <line x1="737" y1="201" x2="824" y2="228" stroke="#3a6a7a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="824" y="220" width="68" height="17" rx="3" fill="#0a1520" stroke="#1e3a5a" stroke-width="1"/>
  <text x="858" y="232" text-anchor="middle" font-size="9" fill="#4a7a8a">Menu Meta</text>

  <!-- ══════════════ HAPTIC SECTION ══════════════ -->
  <rect x="60" y="332" width="780" height="88" rx="10" fill="#0a1520" stroke="#1a3a5a" stroke-width="1"/>
  <text x="450" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd080" letter-spacing="0.5">RETOUR HAPTIQUE — Vibrations proportionnelles à la turbulence</text>

  <text x="118" y="374" text-anchor="middle" font-size="10" fill="#8aaa8a">Calme</text>
  <rect x="150" y="363" width="62" height="11" rx="3" fill="#1a3a2a" stroke="#2a5a3a" stroke-width="1"/>
  <rect x="151" y="364" width="10" height="9" rx="2" fill="#3a7a5a"/>
  <text x="150" y="393" text-anchor="start" font-size="8" fill="#4a7a5a">amp: 0.05  |  intervalle: 350 ms</text>

  <text x="370" y="374" text-anchor="middle" font-size="10" fill="#aacc8a">Modérée</text>
  <rect x="402" y="363" width="62" height="11" rx="3" fill="#1a3a2a" stroke="#2a5a3a" stroke-width="1"/>
  <rect x="403" y="364" width="30" height="9" rx="2" fill="#6aaa5a"/>
  <text x="402" y="393" text-anchor="start" font-size="8" fill="#6aaa5a">amp: ~0.30  |  intervalle: ~200 ms</text>

  <text x="622" y="374" text-anchor="middle" font-size="10" fill="#ffaa5a">Forte</text>
  <rect x="648" y="363" width="62" height="11" rx="3" fill="#2a2a1a" stroke="#5a4a2a" stroke-width="1"/>
  <rect x="649" y="364" width="60" height="9" rx="2" fill="#ff8a3a"/>
  <text x="648" y="393" text-anchor="start" font-size="8" fill="#ff8a3a">amp: 0.60  |  intervalle: 60 ms</text>

  <text x="276" y="374" text-anchor="middle" font-size="10" fill="#4a8a4a">────────▶</text>
  <text x="530" y="374" text-anchor="middle" font-size="10" fill="#8a7a3a">────────▶</text>

  <!-- ══════════════ LEGEND ══════════════ -->
  <rect x="60" y="434" width="780" height="72" rx="10" fill="#080e16" stroke="#1a3a5a" stroke-width="1"/>
  <text x="450" y="453" text-anchor="middle" font-size="11" font-weight="700" fill="#7ac" letter-spacing="0.5">LÉGENDE</text>

  <rect x="80" y="461" width="10" height="10" rx="2" fill="#5abaff"/>
  <text x="96" y="470" font-size="9" fill="#8aaa9a">X / Y = libres pour futures fonctionnalités</text>

  <rect x="300" y="461" width="10" height="10" rx="2" fill="#4aff6a"/>
  <text x="316" y="470" font-size="9" fill="#8aaa9a">Front montant = appui unique détecté</text>

  <rect x="515" y="461" width="10" height="10" rx="2" fill="#5aff9a"/>
  <text x="531" y="470" font-size="9" fill="#8aaa9a">Maintien = valeur analogique continue</text>

  <rect x="720" y="461" width="10" height="10" rx="2" fill="#ffd080"/>
  <text x="736" y="470" font-size="9" fill="#8aaa9a">Deadzone sticks : 0.12</text>

  <text x="80" y="494" font-size="9" fill="#4a6a5a">
    <tspan font-weight="700" fill="#7ac">XRFlightInput.cs</tspan>
    <tspan> active automatiquement </tspan>
    <tspan font-weight="700" fill="#7ac">useXRInput</tspan>
    <tspan> sur </tspan>
    <tspan font-weight="700" fill="#7ac">Plane.cs</tspan>
    <tspan> — le clavier/souris sont désactivés tant que les manettes sont connectées.</tspan>
  </text>
</svg>
